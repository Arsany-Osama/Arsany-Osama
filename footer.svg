<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="1000" height="60" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'Courier New',monospace">
<defs>
  <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#ff2e3b" stop-opacity="0"/><stop offset="0.5" stop-color="#ff2e3b"/><stop offset="0.5" stop-color="#00ff9c"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    <animate attributeName="x1" values="-400;1000" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1400" dur="3.5s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<rect y="0" width="1000" height="2" fill="#00ff9c" fill-opacity="0.12"/>
<rect y="0" width="1000" height="2" fill="url(#sweep)"/>
<text x="500" y="38" font-size="14" fill="#00ff9c" fill-opacity="0.7" text-anchor="middle">// secure by design. shipped to production.</text>
