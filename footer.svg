<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'Courier New',monospace">
<style>
  /* typing: 43 chars x 11px = 473px, stepped per character */
  .cur  { animation: type 9s steps(43) infinite; }
  .blk  { animation: blink 1s steps(1) infinite; }
  @keyframes type {
    0%, 8%   { transform: translateX(0); }
    40%      { transform: translateX(473px); }
    92%      { transform: translateX(473px); }
    92.01%, 100% { transform: translateX(0); }
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  /* border runner: path length normalized to 1000, one full lap per cycle */
  .run { fill: none; stroke-width: 2; animation: lap 6s linear infinite; }
  @keyframes lap { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1000; } }
</style>
<defs>
  <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
    <stop offset="0" stop-color="#07110e"/>
    <stop offset="1" stop-color="#030806"/>
  </linearGradient>

  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#00ff9c" fill-opacity="0.035"/>
  </pattern>

  <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <filter id="glowBorder" filterUnits="userSpaceOnUse" x="-10" y="-10" width="1020" height="84">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1000" height="64" fill="url(#bg)"/>

<circle cx="32" cy="32" r="5" fill="#ff2e3b" fill-opacity="0.85"/>
<circle cx="52" cy="32" r="5" fill="#ffc533" fill-opacity="0.85"/>
<circle cx="72" cy="32" r="5" fill="#00ff9c" fill-opacity="0.85"/>

<text x="110" y="38" font-size="18" fill="#00ff9c" fill-opacity="0.6" textLength="154" lengthAdjust="spacing">guest@prod:~$</text>

<text x="264" y="38" font-size="18" filter="url(#glow)" textLength="473" lengthAdjust="spacing"><tspan fill="#00ff9c" fill-opacity="0.5">// </tspan><tspan fill="#00ff9c">secure by design.</tspan><tspan fill="#d7fff0"> shipped to production.</tspan></text>

<g class="cur">
  <rect x="275" y="0" width="500" height="64" fill="url(#bg)"/>
  <rect class="blk" x="264" y="21" width="10" height="21" fill="#00ff9c" filter="url(#glow)"/>
</g>

<rect x="1" y="1" width="998" height="62" fill="none" stroke="#00ff9c" stroke-opacity="0.12" stroke-width="2"/>

<g filter="url(#glowBorder)">
  <rect class="run" x="1" y="1" width="998" height="62" pathLength="1000" stroke="#00ff9c" stroke-opacity="0.25" stroke-dasharray="200 800"/>
  <rect class="run" x="1" y="1" width="998" height="62" pathLength="1000" stroke="#00ff9c" stroke-opacity="0.55" stroke-dasharray="0 80 120 800"/>
  <rect class="run" x="1" y="1" width="998" height="62" pathLength="1000" stroke="#00ff9c" stroke-opacity="1"    stroke-dasharray="0 150 50 800"/>
  <rect class="run" x="1" y="1" width="998" height="62" pathLength="1000" stroke="#ff2e3b" stroke-opacity="1"    stroke-dasharray="0 200 35 765"/>
</g>

<g transform="translate(900,32)">
  <circle r="4" fill="#00ff9c" filter="url(#glow)"/>
  <circle r="4" fill="none" stroke="#00ff9c" stroke-width="1.2">
    <animate attributeName="r" values="4;11" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="16" y="4" font-size="11" fill="#00ff9c" fill-opacity="0.55" letter-spacing="3">LIVE</text>
</g>

<rect width="1000" height="64" fill="url(#scan)"/>
</svg>
