<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 280" width="1000" height="280" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,'Courier New',monospace">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020405"/><stop offset="0.6" stop-color="#05090c"/><stop offset="1" stop-color="#062a20"/>
  </linearGradient>
  <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0.9"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset="0.9" stop-color="#00ff9c" stop-opacity="0.14"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0.7"/>
  </linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.7">
    <stop offset="0.35" stop-color="#020405" stop-opacity="0"/><stop offset="1" stop-color="#020405" stop-opacity="0.9"/>
  </radialGradient>
  <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#ff2e3b" stop-opacity="0"/><stop offset="0.5" stop-color="#ff2e3b"/><stop offset="0.5" stop-color="#00ff9c"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    <animate attributeName="x1" values="-400;1000" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1400" dur="3.5s" repeatCount="indefinite"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#00ff9c" stroke-opacity="0.07" stroke-width="1"/>
    <animateTransform attributeName="patternTransform" type="translate" values="0 0;40 0" dur="3s" repeatCount="indefinite"/>
  </pattern>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="cPrompt"><rect x="265" y="60" width="0" height="50">
    <animate attributeName="width" calcMode="discrete" values="0;16;32;49;65;81;98;114;130" dur="0.9s" begin="0.4s" fill="freeze"/></rect></clipPath>
  <clipPath id="cSub"><rect x="260" y="190" width="0" height="40">
    <animate attributeName="width" calcMode="discrete" values="0;12;24;36;48;60;72;84;96;108;120;132;144;156;168;180;192;204;216;228;240;252;264;276;288;300;312;324;336;348;360;372;384;396;408;420;432;444;456;468;480" dur="1.8s" begin="2.4s" fill="freeze"/></rect></clipPath>

  <text id="c1" font-size="14" fill="url(#rain)"><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">A</tspan><tspan x="0" dy="16">F</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">7</tspan><tspan x="0" dy="16">E</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">1</tspan></text>
  <text id="c2" font-size="14" fill="url(#rain)"><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">C</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">B</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">9</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">D</tspan><tspan x="0" dy="16">0</tspan></text>
  <text id="c3" font-size="14" fill="url(#rain)"><tspan x="0" dy="16">F</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">D</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">1</tspan><tspan x="0" dy="16">4</tspan><tspan x="0" dy="16">0</tspan><tspan x="0" dy="16">A</tspan><tspan x="0" dy="16">1</tspan></text>
</defs>

<rect width="1000" height="280" fill="url(#bg)"/>
<rect width="1000" height="280" fill="url(#grid)"/>

<g opacity="0.55">
  <use xlink:href="#c1" href="#c1" x="20"><animateTransform attributeName="transform" type="translate" values="0 -180;0 300" dur="6.2s" begin="-1s" repeatCount="indefinite"/></use>
  <use xlink:href="#c2" href="#c2" x="82"><animateTransform attributeName="transform" type="translate" values="0 -200;0 300" dur="8.1s" begin="-5s" repeatCount="indefinite"/></use>
  <use xlink:href="#c3" href="#c3" x="144"><animateTransform attributeName="transform" type="translate" values="0 -190;0 300" dur="7.0s" begin="-3s" repeatCount="indefinite"/></use>
  <use xlink:href="#c2" href="#c2" x="206"><animateTransform attributeName="transform" type="translate" values="0 -200;0 300" dur="9.3s" begin="-7s" repeatCount="indefinite"/></use>
  <use xlink:href="#c1" href="#c1" x="268"><animateTransform attributeName="transform" type="translate" values="0 -180;0 300" dur="5.6s" begin="-2s" repeatCount="indefinite"/></use>
  <use xlink:href="#c3" href="#c3" x="330"><animateTransform attributeName="transform" type="translate" values="0 -190;0 300" dur="8.7s" begin="-6s" repeatCount="indefinite"/></use>
  <use xlink:href="#c1" href="#c1" x="392"><animateTransform attributeName="transform" type="translate" values="0 -180;0 300" dur="7.4s" begin="-4s" repeatCount="indefinite"/></use>
  <use xlink:href="#c2" href="#c2" x="454"><animateTransform attributeName="transform" type="translate" values="0 -200;0 300" dur="6.6s" begin="-8s" repeatCount="indefinite"/></use>
  <use xlink:href="#c3" href="#c3" x="516"><animateTransform attributeName="transform" type="translate" values="0 -190;0 300" dur="9.0s" begin="-1.5s" repeatCount="indefinite"/></use>
  <use xlink:href="#c1" href="#c1" x="578"><animateTransform attributeName="transform" type="translate" values="0 -180;0 300" dur="7.8s" begin="-5.5s" repeatCount="indefinite"/></use>
  <use xlink:href="#c2" href="#c2" x="640"><animateTransform attributeName="transform" type="translate" values="0 -200;0 300" dur="5.9s" begin="-3.5s" repeatCount="indefinite"/></use>
  <use xlink:href="#c3" href="#c3" x="702"><animateTransform attributeName="transform" type="translate" values="0 -190;0 300" dur="8.4s" begin="-9s" repeatCount="indefinite"/></use>
  <use xlink:href="#c1" href="#c1" x="764"><animateTransform attributeName="transform" type="translate" values="0 -180;0 300" dur="6.9s" begin="-2.5s" repeatCount="indefinite"/></use>
  <use xlink:href="#c2" href="#c2" x="826"><animateTransform attributeName="transform" type="translate" values="0 -200;0 300" dur="9.6s" begin="-6.5s" repeatCount="indefinite"/></use>
  <use xlink:href="#c3" href="#c3" x="888"><animateTransform attributeName="transform" type="translate" values="0 -190;0 300" dur="7.2s" begin="-4.5s" repeatCount="indefinite"/></use>
  <use xlink:href="#c1" href="#c1" x="950"><animateTransform attributeName="transform" type="translate" values="0 -180;0 300" dur="8.0s" begin="-7.5s" repeatCount="indefinite"/></use>
</g>

<rect width="1000" height="280" fill="url(#vig)"/>

<rect width="1000" height="70" y="-70" fill="url(#scan)">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 350" dur="4.5s" repeatCount="indefinite"/>
</rect>

<path d="M18 46V18H46M954 18H982V46M18 234V262H46M954 262H982V234" fill="none" stroke="#00ff9c" stroke-opacity="0.55" stroke-width="2"/>
<text x="40" y="40" font-size="13" fill="#00ff9c" fill-opacity="0.6">root@arsany:~#</text>
<text x="960" y="40" font-size="13" fill="#00ff9c" fill-opacity="0.6" text-anchor="end">SECURE SESSION</text>
<circle cx="824" cy="35" r="4" fill="#ff2e3b"><animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/></circle>

<g clip-path="url(#cPrompt)">
  <text x="265" y="96" font-size="22" fill="#00ff9c" fill-opacity="0.75" textLength="130" lengthAdjust="spacing">$ whoami</text>
</g>

<g>
  <text x="265" y="172" font-size="68" font-weight="700" fill="#ff2e3b" opacity="0" textLength="470" lengthAdjust="spacingAndGlyphs">Arsany Osama
    <animate attributeName="opacity" values="0;0;0.85;0;0.6;0;0" keyTimes="0;0.86;0.88;0.9;0.92;0.94;1" dur="5s" begin="2.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-7 0;5 0;-4 0;0 0;0 0" keyTimes="0;0.86;0.88;0.9;0.92;0.94;1" dur="5s" begin="2.6s" repeatCount="indefinite"/>
  </text>
  <text x="265" y="172" font-size="68" font-weight="700" fill="#ffffff" opacity="0" textLength="470" lengthAdjust="spacingAndGlyphs">Arsany Osama
    <animate attributeName="opacity" values="0;0;0.5;0;0.4;0;0" keyTimes="0;0.86;0.88;0.9;0.92;0.94;1" dur="5s" begin="2.6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;6 0;-5 0;4 0;0 0;0 0" keyTimes="0;0.86;0.88;0.9;0.92;0.94;1" dur="5s" begin="2.6s" repeatCount="indefinite"/>
  </text>
  <text x="265" y="172" font-size="68" font-weight="700" fill="#00ff9c" filter="url(#glow)" opacity="0" textLength="470" lengthAdjust="spacingAndGlyphs">Arsany Osama
    <animate attributeName="opacity" values="0;1" dur="0.15s" begin="1.5s" fill="freeze"/>
  </text>
</g>

<g clip-path="url(#cSub)">
  <text x="260" y="214" font-size="20" fill="#d7ffe9" fill-opacity="0.9" textLength="480" lengthAdjust="spacing">Software Engineer  |  Cloud  |  Security</text>
</g>
<rect x="748" y="198" width="11" height="20" fill="#00ff9c" opacity="0">
  <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1s" begin="2.4s" repeatCount="indefinite"/>
</rect>

<rect y="276" width="1000" height="4" fill="url(#sweep)"/>
</svg>
